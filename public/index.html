<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forever AH</title>
  <link rel="icon" href="/placeholder.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark">◆</span> Forever AH</a>
    <nav class="tabs">
      <a href="#/" data-tab="market">Market</a>
      <a href="#/professions" data-tab="professions">Professions</a>
      <a href="#/characters" data-tab="characters">Characters</a>
    </nav>
    <div class="global-search">
      <input id="global-search" type="search" placeholder="Search any item…  ( / )" autocomplete="off" spellcheck="false">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <label class="house-picker">
      <span>House</span>
      <select id="house-select"></select>
    </label>
  </header>
  <main id="view"></main>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
